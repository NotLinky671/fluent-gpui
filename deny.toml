# Dependency policy for fluent-gpui (T-013).
#
# The allow list is derived from the actual dependency tree, not copied from a
# template: `cargo metadata --format-version 1` groups every resolved package by
# its SPDX expression. Re-derive it when the tree changes.
#
# Notes on the less common entries:
# - MPL-2.0: cbindgen (build-time only), dwrote (Windows DirectWrite bindings),
#   option-ext. File-level copyleft; linking is fine, modifications to those
#   files must stay MPL.
# - Unicode-3.0: the ICU4X stack (text segmentation, normalisation).
# - Zlib / 0BSD / CC0-1.0 / Unlicense / MIT-0 / NCSA: permissive.
# - OFL-1.1: reserved for the optional bundled Selawik font (ADR-0004).
# - GPL-2.0-only and LGPL-2.1-or-later only ever appear as alternatives
#   ("Apache-2.0 OR GPL-2.0-only", "MIT OR Apache-2.0 OR LGPL-2.1-or-later"),
#   so the permissive branch is always taken.

[advisories]
version = 2
yanked = "warn"
# Every entry below is an "unmaintained" notice (not a vulnerability) for a
# transitive dependency of the pinned gpui-pre snapshot, and none of them has a
# safe upgrade. They are listed individually rather than switching the whole
# `unmaintained` class off, so a *new* advisory in any of these crates still
# fails the build. Re-check this list whenever the gpui pin moves.
ignore = [
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0206", # rustybuzz
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]

[licenses]
version = 2
# 0.9 still accepts legacy expressions such as "MIT/Apache-2.0".
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "NCSA",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
]

# Two allow entries are intentionally unused today: NCSA (libfuzzer-sys, which
# only resolves for fuzzing targets) and OFL-1.1 (reserved for Selawik).
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"