name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when a new commit lands on the same ref: without
# this, rapid pushes pile up 10+ minute runs and the check list looks stuck.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # gpui-pre needs X11/Wayland, fontconfig and a Vulkan loader on Linux.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcb-sync-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev pkg-config

      # Compiling gpui from scratch takes most of the run; the cache is keyed on
      # Cargo.lock so it survives source-only changes.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      # Prebuilt binary: `cargo install cargo-deny` compiles it every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Docs
        run: cargo doc --workspace --no-deps

      # License allow list, duplicate bans, RustSec advisories (T-013).
      - name: Dependency policy
        run: cargo deny check

      # Generated code must match its snapshot.
      - name: Tokens in sync
        run: cargo xtask gen-tokens --check

      - name: Icons in sync
        run: cargo xtask gen-icons --check

      # Opens the gallery for 1.5s and quits. Catches the class of bug that unit
      # tests and pixel baselines cannot: a panic while building the tree.
      - name: Boot smoke
        if: runner.os == 'Windows'
        run: cargo run -p fluent-gallery
        env:
          FLUENT_GALLERY_SMOKE: "1"

      # Screenshots are scratch: only committed pixel baselines may be tracked.
      - name: No stray images
        shell: bash
        run: |
          stray=$(git ls-files | grep -Ei '\.(png|jpe?g|webp)$' | grep -v '^crates/fluent-gallery/tests/baselines/' || true)
          if [ -n "$stray" ]; then
            echo "::error::tracked images outside crates/fluent-gallery/tests/baselines:"
            echo "$stray"
            exit 1
          fi