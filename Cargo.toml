[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NotLinky671/fluent-gpui"

[workspace.dependencies]
# GPUI stack — exact pins, see plan/01-decisions.md ADR-0001.
# `gpui-pre` is a republished snapshot of Zed's gpui; a caret requirement
# would drift onto an incompatible API.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-base = { version = "=0.8.1" }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.10" }

# Internal crates
fluent-tokens = { path = "crates/fluent-tokens", version = "0.1.0" }
fluent-theme = { path = "crates/fluent-theme", version = "0.1.0" }
fluent-icons = { path = "crates/fluent-icons", version = "0.1.0" }
fluent-core = { path = "crates/fluent-core", version = "0.1.0" }
fluent-components = { path = "crates/fluent-components", version = "0.1.0" }
fluent-ui = { path = "crates/fluent-ui", version = "0.1.0" }

anyhow = "1"
tracing = "0.1"

# GPUI's own profile guidance: these crates dominate frame time in debug
# builds and are cheap to optimize.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }