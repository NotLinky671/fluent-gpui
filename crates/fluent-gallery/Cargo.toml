[package]
name = "fluent-gallery"
description = "Component gallery and manual review surface for fluent-ui."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fluent-gallery"
path = "src/main.rs"

[features]
# Enables `window.render_to_image()` for screenshots. Pulls in gpui's
# test-support, so it stays off by default.
screenshot = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
fluent-ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Behaviour tests use GPUI's TestAppContext; the feature must be enabled on the
# same gpui package graph as fluent-ui. Production builds do not depend on it.
gpui = { workspace = true, features = ["test-support"] }